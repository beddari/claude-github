name: labs

# End-to-end run of labs/: acme-env in podman, then a Talos cluster in Docker
# that gets DNS records and certificates from it. It takes about 6 minutes, so
# on a pull request it runs only when bin/labs-changed says the change needs
# it; changes to the labs' docs do not. When it does not run, e2e is skipped,
# which counts as passed, so e2e can be a required check. It does not run
# again on main: with "require branches to be up to date", a pull request was
# tested as main will be.
on:
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      labs: ${{ steps.diff.outputs.labs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: diff
        # HEAD is the pull request merged into its base, HEAD^1 the base.
        run: |
          labs="$(bin/labs-changed HEAD^1 HEAD)"
          echo "labs=$labs" >> "$GITHUB_OUTPUT"

  e2e:
    needs: changes
    if: needs.changes.outputs.labs == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Rootful podman so the ACME smoke test can bind port 80.
      PODMAN: sudo podman
    steps:
      - uses: actions/checkout@v4
      - name: Tools (Homebrew is preinstalled on ubuntu runners)
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew install go-task talosctl
          echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - run: task ci
      - name: acme-env up + end-to-end test
        run: |
          task acme-env:up
          task acme-env:check
      - name: talos-cluster up + verify
        run: |
          # Lets a pod reach a service whose pod is on the same node.
          sudo modprobe br_netfilter
          task talos-cluster:up
      - name: Diagnostics
        if: failure()
        run: |
          task acme-env:status || true
          sudo podman logs acme-env-ca 2>&1 | tail -50 || true
          task acme-env:records || true
          task talos-cluster:debug || true
      - name: Tear down
        if: always()
        run: |
          task --yes talos-cluster:down || true
          task acme-env:down || true
