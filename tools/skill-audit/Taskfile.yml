# skill-audit: a Go CLI. Arguments go after --: tools/skill-audit/README.md.
version: "3"

tasks:
  # Plain "task" lists the tasks.
  default:
    silent: true
    cmds:
      - task --list

  fmt:
    desc: gofmt all sources
    cmds:
      - gofmt -w .

  vet:
    desc: go vet and a gofmt check
    cmds:
      - go vet ./...
      - 'test -z "$(gofmt -l .)" || (gofmt -l . && echo "unformatted files; run task fmt" && exit 1)'

  test:
    desc: Run unit and CLI tests
    cmds:
      - go test -race -count=1 ./...

  build:
    desc: Build the binary into bin/
    sources: ['**/*.go', go.mod]
    generates: [bin/skill-audit]
    cmds:
      - go build -trimpath -ldflags="-s -w" -o {{.TASKFILE_DIR}}/bin/skill-audit .

  install:
    desc: go install skill-audit onto your PATH ($GOBIN or ~/go/bin)
    cmds:
      - go install -trimpath .

  ci:
    desc: Everything CI should run (vet, test, build, self-check against fixtures)
    cmds:
      - task: vet
      - task: test
      - task: build
      - task: verify

  verify:
    desc: Prove the binary works end-to-end on the bundled good/bad fixtures
    deps: [build]
    cmds:
      - '{{.TASKFILE_DIR}}/bin/skill-audit -strict -strict-warn internal/audit/testdata/good-skill > /dev/null'
      - '! {{.TASKFILE_DIR}}/bin/skill-audit -strict internal/audit/testdata/bad-skill > /dev/null'
      - '{{.TASKFILE_DIR}}/bin/skill-audit -format json internal/audit/testdata | grep -q ''"status": "fail"'''
      - '{{.TASKFILE_DIR}}/bin/skill-audit -prompt internal/audit/testdata | grep -q "before changing anything"'
      - echo "verify OK"

  audit:
    desc: "Audit skills; with no paths, ~/.claude/skills and ./.claude/skills. Flags and paths after --"
    dir: '{{.USER_WORKING_DIR}}'
    deps: [build]
    cmds:
      - '{{.TASKFILE_DIR}}/bin/skill-audit {{.CLI_ARGS}}'

  report:
    desc: "Write the audit as markdown to skill-audit.md. Paths after --"
    dir: '{{.USER_WORKING_DIR}}'
    deps: [build]
    cmds:
      - '{{.TASKFILE_DIR}}/bin/skill-audit -format markdown {{.CLI_ARGS}} > skill-audit.md'
      - echo "wrote skill-audit.md"

  prompt:
    desc: "Print one Claude prompt that fixes every skill needing work. Paths after --"
    dir: '{{.USER_WORKING_DIR}}'
    deps: [build]
    cmds:
      - '{{.TASKFILE_DIR}}/bin/skill-audit -prompt {{.CLI_ARGS}}'

  prompts:
    desc: "Write one prompts/<skill>.prompt.md per skill needing work. Paths after --"
    dir: '{{.USER_WORKING_DIR}}'
    deps: [build]
    cmds:
      - mkdir -p prompts
      - '{{.TASKFILE_DIR}}/bin/skill-audit -prompt -prompt-dir prompts {{.CLI_ARGS}} > prompts/ALL.prompt.md'
      - ls -1 prompts

  fix:
    desc: "Start Claude Code with the fix prompt as its first message (needs the claude CLI). Paths after --"
    dir: '{{.USER_WORKING_DIR}}'
    deps: [build]
    interactive: true
    preconditions:
      - sh: command -v claude
        msg: "The claude CLI is missing: run task skill-audit:prompt and paste its output"
    cmds:
      - 'claude "$({{.TASKFILE_DIR}}/bin/skill-audit -prompt {{.CLI_ARGS}})"'

  checks:
    desc: List every check and the rule it enforces
    deps: [build]
    cmds:
      - '{{.TASKFILE_DIR}}/bin/skill-audit -list-checks'

  clean:
    desc: Remove build output
    cmds:
      - rm -rf bin .task
