# The repository's tasks. Each project's tasks are listed as <project>:<task>.
# A task with any logic calls a script in bin/; see README.md.
version: "3"

tasks:
  # Plain "task" lists the tasks.
  default:
    silent: true
    cmds:
      - task --list

  tools:
    desc: Install the tools in the Brewfile (macOS, or Linux with Homebrew)
    cmds:
      - brew bundle --file Brewfile

  ci:
    desc: Check the drawer's index and the docs' links, then run every project's ci. What CI runs
    silent: true
    cmds:
      - bin/ci

  lint:
    desc: Run shellcheck on every bin/ folder and the session hook
    silent: true
    cmds:
      - bin/lint

  labs-changed:
    desc: Say whether the changes since a commit, origin/main by default, need the labs run end to end
    silent: true
    cmds:
      - bin/labs-changed {{.CLI_ARGS}}

  index-check:
    desc: Check that wires.json lists every project under apps/, tools/ and labs/
    cmds:
      - go run ./infra/drawer check

  docs-check:
    desc: Check that every relative link in every markdown file points to a file and heading that exist
    cmds:
      - go run ./infra/drawer docs

  wire-add:
    desc: 'Add a project to the drawer: task wire-add -- NAME PATH app|tool|lab "what it does"'
    cmds:
      - go run ./infra/drawer add {{.CLI_ARGS}}

  new-go:
    desc: 'Create a Go CLI at tools/NAME and register it everywhere: task new-go -- NAME "what it does"'
    silent: true
    cmds:
      - bin/new-go {{.CLI_ARGS}}

  serve:
    desc: Serve the repository as it is (drawer and apps) at http://127.0.0.1:8000/
    cmds:
      - go run ./infra/drawer serve -port 8000 .

  site:
    desc: Build the GitHub Pages site into _site/, as the pages workflow does
    cmds:
      - go run ./infra/drawer site

  site-serve:
    desc: Build _site/ and serve it at http://127.0.0.1:8000/
    cmds:
      - go run ./infra/drawer site
      - go run ./infra/drawer serve -port 8000 _site

  clean:
    desc: Remove _site/ and run every project's clean task
    silent: true
    cmds:
      - bin/clean

# Keep includes: last. bin/new-go appends new projects to the end of this file.
includes:
  drawer:
    taskfile: infra/drawer/Taskfile.yml
    dir: infra/drawer
  spillelista:
    taskfile: apps/spillelista/Taskfile.yml
    dir: apps/spillelista
  skill-audit:
    taskfile: tools/skill-audit/Taskfile.yml
    dir: tools/skill-audit
  acme-env:
    taskfile: labs/acme-env/Taskfile.yml
    dir: labs/acme-env
  talos-cluster:
    taskfile: labs/talos-cluster/Taskfile.yml
    dir: labs/talos-cluster
