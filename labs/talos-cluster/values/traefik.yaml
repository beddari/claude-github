# Traefik on every worker's ports 80 and 443, as hostPorts. Ingresses get
# the first worker's address as theirs: labs/docs/troubleshooting.md.
deployment:
  kind: DaemonSet
ports:
  web:
    hostPort: 80
  websecure:
    hostPort: 443
service:
  type: ClusterIP
ingressClass:
  enabled: true
  isDefaultClass: true
providers:
  kubernetesIngress:
    publishedService:
      enabled: false
    ingressEndpoint:
      ip: ""  # set by bin/addons: the first worker's address
