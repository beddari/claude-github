# external-dns writes the names of Ingresses and Services in the lab zone
# into acme-env's etcd, which acme-env's CoreDNS serves.
provider:
  name: coredns
env:
  - name: ETCD_URLS
    value: ""  # set by bin/addons: http://HOST_IP:ETCD_PORT
sources: [ingress, service]
domainFilters: []  # set by bin/addons: the lab zone
policy: sync
registry: txt
txtOwnerId: ""  # set by bin/addons: the cluster's name
interval: 10s
